name: pset3-oulad
services:
  mlflow:
    build: ./mlflow
    ports:
      - "127.0.0.1:5001:5000"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/backend/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --default-artifact-root=mlflow-artifacts:/
    volumes:
      - mlflow_backend:/mlflow/backend
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mlflow_backend:
  mlflow_artifacts:
