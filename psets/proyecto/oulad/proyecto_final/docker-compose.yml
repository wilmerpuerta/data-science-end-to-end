name: ${PSET4_COMPOSE_PROJECT:-proyecto-final}
services:
  api:
    image: ${PSET4_API_IMAGE:?Fijar imagen GHCR publicada por commit o digest}
    build:
      context: .
      dockerfile: api/Dockerfile
      target: api
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5001}
      PSET4_MODEL_MODE: ${PSET4_MODEL_MODE:-mlflow}
      PSET4_FORCE_FALLBACK: ${PSET4_FORCE_FALLBACK:-0}
      PSET4_CAPACITY: ${PSET4_CAPACITY:-0.10}
      PSET4_WEEK2_SHARE: ${PSET4_WEEK2_SHARE:-0.25}
      PSET4_POLICY_VERSION: ${PSET4_POLICY_VERSION:-preventiva-prototipo-0.1}
      PSET4_DB_PATH: /app/.local/operacion.sqlite
      MLFLOW_HTTP_REQUEST_TIMEOUT: '10'
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: '0'
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${PSET4_API_PORT:-8004}:8000
    volumes:
      - ./.local:/app/.local
    mem_limit: 1536m
    restart: unless-stopped
  postgres:
    image: postgres:17.6@sha256:b86568d3e0fe1dfaeff52714f9da36f206a30e4c49131b82bf96982d78627409
    platform: linux/amd64
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${PSET4_POSTGRES_PASSWORD:?Configurar secreto local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    restart: unless-stopped
  kestra:
    image: proyecto-final-kestra:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: api/Dockerfile
      target: kestra
    user: root
    command: server standalone
    environment:
      JAVA_OPTS: -Xms256m -Xmx1024m
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${PSET4_POSTGRES_PASSWORD:?Configurar secreto local}
        kestra:
          server:
            basicAuth:
              username: admin@psets.local
              password: ${PSET4_KESTRA_PASSWORD:?Configurar secreto local}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:${PSET4_KESTRA_PORT:-8094}/
    ports:
      - 127.0.0.1:${PSET4_KESTRA_PORT:-8094}:8080
      - 127.0.0.1:${PSET4_KESTRA_MANAGEMENT_PORT:-8095}:8081
    volumes:
      - kestra-data:/app/storage
      - kestra-tmp:/tmp/kestra-wd
      - ./src:/workspace/src:ro
      - ./monitoreo:/workspace/monitoreo:ro
      - ./tests/fixtures:/workspace/tests/fixtures:ro
      - ./.local:/workspace/.local
      - type: bind
        source: ${SNOWFLAKE_CONNECTION_HOST_PATH:?Configurar ruta privada}
        target: /run/secrets/snowflake_connection.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNOWFLAKE_PRIVATE_KEY_HOST_PATH:?Configurar ruta privada}
        target: /run/secrets/snowflake_key.p8
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1792m
    restart: unless-stopped
  api_deriva:
    extends:
      service: api
    environment:
      PSET4_DB_PATH: /app/.local/deriva/operacion.sqlite
    ports: !override
      - 127.0.0.1:${PSET4_API_DERIVA_PORT:-8006}:8000
  monitoreo:
    image: ${PSET4_API_IMAGE:?Fijar imagen GHCR publicada por commit o digest}
    command: [python, -m, monitoreo.deriva, --servir]
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://host.docker.internal:5001}
      PSET4_KESTRA_URL: http://kestra:8080/api/v1/main
      PSET4_KESTRA_USER: admin@psets.local
      PSET4_KESTRA_PASSWORD: ${PSET4_KESTRA_PASSWORD:?Configurar secreto local}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./.local:/app/.local
      - type: bind
        source: ${SNOWFLAKE_CONNECTION_HOST_PATH:?Configurar ruta privada}
        target: /run/secrets/snowflake_connection.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNOWFLAKE_PRIVATE_KEY_HOST_PATH:?Configurar ruta privada}
        target: /run/secrets/snowflake_key.p8
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/salud')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1536m
    restart: unless-stopped
  tablero:
    image: ${PSET4_API_IMAGE:?Fijar imagen GHCR publicada por commit o digest}
    command: [streamlit, run, monitoreo/deriva.py, --server.address=0.0.0.0, --server.port=8501, --browser.gatherUsageStats=false]
    environment:
      PSET4_TABLERO: '1'
    volumes:
      - ./docs:/app/docs:ro
      - ./.local/negocio:/app/.local/negocio:ro
    ports:
      - 127.0.0.1:${PSET4_TABLERO_PORT:-8504}:8501
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    restart: unless-stopped

volumes:
  postgres-data:
  kestra-data:
  kestra-tmp:
