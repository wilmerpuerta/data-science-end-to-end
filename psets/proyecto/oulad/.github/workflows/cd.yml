name: proyecto-final-cd
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: proyecto-final-cd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publicar:
    needs: pruebas
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Localizar proyecto e imagen
        id: proyecto
        shell: bash
        run: |
          set -euo pipefail
          if [ -f psets/proyecto/oulad/proyecto_final/requirements.txt ]; then
            echo 'ruta=psets/proyecto/oulad/proyecto_final' >> "$GITHUB_OUTPUT"
          elif [ -f proyecto_final/requirements.txt ]; then
            echo 'ruta=proyecto_final' >> "$GITHUB_OUTPUT"
          else
            echo 'No se encuentra proyecto_final/requirements.txt'
            exit 1
          fi
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oulad-proyecto-final-api" >> "$GITHUB_OUTPUT"
      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir imagen del commit
        env:
          RUTA: ${{ steps.proyecto.outputs.ruta }}
          IMAGEN: ${{ steps.proyecto.outputs.imagen }}
        run: |
          docker build --platform linux/amd64 --target api \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label 'org.opencontainers.image.title=OULAD apoyo académico preventivo' \
            -t "${IMAGEN}:${GITHUB_SHA}" -f "${RUTA}/api/Dockerfile" "${RUTA}"
      - name: Probar la imagen exacta que se publicará
        env:
          IMAGEN: ${{ steps.proyecto.outputs.imagen }}
        run: |
          docker run --rm -e PSET4_MODEL_MODE=fixture -e PSET4_FULL_TESTS=1 \
            "${IMAGEN}:${GITHUB_SHA}" python -m pytest tests -q -p no:cacheprovider
      - name: Publicar y registrar identidad
        env:
          IMAGEN: ${{ steps.proyecto.outputs.imagen }}
        run: |
          set -euo pipefail
          docker push "${IMAGEN}:${GITHUB_SHA}"
          python - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tag = os.environ['IMAGEN'] + ':' + os.environ['GITHUB_SHA']
          meta = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag]))[0]
          digest = next(d for d in meta['RepoDigests'] if d.startswith(os.environ['IMAGEN'] + '@sha256:'))
          release = {'imagen': tag, 'digest': digest, 'commit': os.environ['GITHUB_SHA'],
                     'plataforma': 'linux/amd64', 'pruebas_imagen': 57,
                     'workflow_run': os.environ['GITHUB_RUN_ID']}
          Path('imagen-publicada.json').write_text(json.dumps(release, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Imagen publicada tras CI y pruebas del artefacto final.\n\n')
              out.write('```text\nPSET4_API_IMAGE=' + digest + '\n```\n')
              out.write('\nTag por commit: `' + tag + '`\n')
              out.write('\nLa publicación del código no cambia los aliases del Model Registry.\n')
          PYTHON
      - name: Conservar metadatos de la publicación
        uses: actions/upload-artifact@v4
        with:
          name: imagen-publicada-${{ github.sha }}
          path: imagen-publicada.json
          retention-days: 30
