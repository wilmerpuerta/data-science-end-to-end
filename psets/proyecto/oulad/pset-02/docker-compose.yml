name: ${PSET2_COMPOSE_PROJECT_NAME:-pset2}
services:
  postgres:
    image: postgres:17.6@sha256:b86568d3e0fe1dfaeff52714f9da36f206a30e4c49131b82bf96982d78627409
    platform: linux/amd64
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${PSET2_POSTGRES_PASSWORD:?Ejecutar preparar_infra.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  kestra:
    image: kestra/kestra:v1.0.0@sha256:3eb172635bf54cfa8856ac633d4d76391da2c366a14e2e4ba760b96ec5b1759e
    platform: linux/amd64
    user: root
    command: server standalone
    environment:
      JAVA_OPTS: -Xms256m -Xmx1536m
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${PSET2_POSTGRES_PASSWORD:?Ejecutar preparar_infra.py}
        kestra:
          server:
            basicAuth:
              username: admin@psets.local
              password: ${PSET2_KESTRA_PASSWORD:?Ejecutar preparar_infra.py}
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:${PSET2_KESTRA_PORT:-8080}/
    ports:
      - 127.0.0.1:${PSET2_KESTRA_PORT:-8080}:8080
      - 127.0.0.1:${PSET2_KESTRA_MANAGEMENT_PORT:-8081}:8081
    volumes:
      - kestra-data:/app/storage
      - kestra-tmp:/tmp/kestra-wd
      - type: bind
        source: ${OULAD_DATA_DIR:-../datasets}
        target: /datasets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 2304m
    restart: unless-stopped

  spark:
    image: spark:3.5.6-scala2.12-java17-python3-ubuntu@sha256:fee303e5788e8f3875aac670611f0be12012e866f09147ad59386d5e6239232c
    platform: linux/amd64
    entrypoint: [/bin/bash, -c]
    command: ['exec sleep infinity']
    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3
    volumes:
      - type: bind
        source: ${OULAD_DATA_DIR:-../datasets}
        target: /datasets
        read_only: true
        bind:
          create_host_path: false
      - ./spark:/workspace/spark:ro
    working_dir: /workspace/spark
    healthcheck:
      test: [CMD-SHELL, 'test -x /opt/spark/bin/spark-submit && java -version >/dev/null 2>&1 && python3 --version >/dev/null']
      interval: 20s
      timeout: 5s
      retries: 3
    mem_limit: 2304m
    restart: unless-stopped

  dbt:
    profiles: [tools]
    image: pset2-dbt:core1.10.13-snowflake1.10.2
    platform: linux/amd64
    build:
      context: ./dbt
    working_dir: /workspace/dbt
    volumes:
      - ./dbt:/workspace/dbt
    environment:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    mem_limit: 1536m

volumes:
  postgres-data:
  kestra-data:
  kestra-tmp:
